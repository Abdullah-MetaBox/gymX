# Optional: only needed if you do NOT already have PostgreSQL 16+ locally.
# The default .env points at localhost:5433, matching a native install.
# If you use this file instead, change the ports below or your .env to agree.
services:
  postgres:
    image: postgres:18-alpine
    container_name: gymx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gymx
    ports:
      - '5433:5432'
    volumes:
      - gymx-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d gymx']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gymx-pgdata:
